# Symphony-Lite 配置示例
# OpenCode-centric reference implementation
#
# 使用说明：
# 1. 复制此文件为 config.yaml
# 2. 根据你的环境调整路径和参数
# 3. 运行 python scripts/run_orchestrator.py

tracker:
  kind: "jsonfile"
  tasks_file: "./symphony_data/tasks.json"
  active_states:
    - "Todo"
    - "In Progress"
  terminal_states:
    - "Done"
    - "Canceled"

polling:
  interval_ms: 30000

workspace:
  root: "./symphony_data/workspace_root"
  cleanup:
    enabled: true
    max_age_hours: 24
    check_interval_ticks: 40

memory:
  constitution_file: "./symphony_data/constitution.md"
  index_root: "./symphony_data/memory_index"
  record_template: "{index_root}/{topic}/{date}-{slug}.md"
  index_filename: ".index.md"
  index_max_entries: 50
  index_min_entries: 10
  keyword_filter: true

hooks:
  # after_create: git clone {{ repo_url }} .
  # before_run:  python check_env.py
  # after_run:   cp output/*.md ./inbox/
  # before_remove: rm -rf /tmp/build_cache
  timeout_ms: 60000

agent:
  executor: "opencode"
  opencode:
    command: "opencode --agent"
    max_turns: 20
    pty_wrapper_script: "../../EXAMPLES/opencode_centric/opencode_pty_wrapper.py"
  max_concurrent_agents: 3
  max_retry_backoff_ms: 300000

timeouts:
  read_timeout_ms: 5000
  turn_timeout_ms: 3600000
  stall_timeout_ms: 300000

logging:
  level: "INFO"
  file: "./symphony_data/logs/symphony.log"
  max_size_mb: 10

notification:
  # sillack_web_url: "http://localhost:8001"   # 可选：sillack-web 地址
  inbox_dir: "./symphony_data/inbox"
  enabled: true

sandbox:
  enabled: true
  backup_orig: true
  audit_log: true

verify:
  auto_enabled: false
  threshold: 80
